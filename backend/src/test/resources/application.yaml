spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  crypto:
    secret: chave-de-teste-nao-usar-em-producao-0123
  estoque:
    limiar-compra-percentual: 0.30
  cors:
    allowed-origins: http://localhost:4200
