server:
  port: 8080

spring:
  application:
    name: controle-estoque

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:controle_estoque}
    username: ${DB_USER:controle_estoque}
    password: ${DB_PASSWORD:controle_estoque}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  crypto:
    secret: ${CRYPTO_SECRET:0123456789abcdef0123456789abcdef}
  estoque:
    limiar-compra-percentual: ${ESTOQUE_LIMIAR_PERCENTUAL:0.30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health
