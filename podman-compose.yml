services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: controle_estoque
      POSTGRES_USER: controle_estoque
      POSTGRES_PASSWORD: controle_estoque
    ports:
      - "5433:5432"
    volumes:
      - controle_estoque_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controle_estoque"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: controle_estoque
      DB_USER: controle_estoque
      DB_PASSWORD: controle_estoque
      CRYPTO_SECRET: troque-esta-chave-em-producao-0123456789abcdef
      CORS_ALLOWED_ORIGINS: http://localhost:4201
    ports:
      - "8090:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    ports:
      - "4201:80"
    depends_on:
      - backend

volumes:
  controle_estoque_db_data:
